<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="speech.css ">
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/6.0.0/tesseract.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/6.0.0/tesseract.min.js"></script>
    <title>speech</title>
</head>
<body>
    <div class="hero">
        <h1>Text To Speech <span>Converter</span></h1>
        <video height="300px" id="camFeed" autoplay></video>
        <button id="camGo">Read Text</button>
        <input type="file" accept="image/*" id="fileIn">
        <textarea placeholder="write anything hre..." id="textOut"></textarea>
        <div class="row">
            <select name="" id=""></select>
            <button class="button" id="listen"><img src="images/play.png" alt=""> listen</button>
            <button class="button" id="pause"><img src="images/stop.jpg" alt=""> stop</button>
        </div>
    </div>
    <script src="speech.js"></script> 
</body>
</html>
