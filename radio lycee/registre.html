<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv=“X-UA-Compatible” content=“ie=edge”>
    <title>login</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="registre.css">
</head>

<body>
    <div class="main">
        <form action="radio.html" method="post">
            <h1>bienvenue chez notre clubs</h1>
            <div class="textbox">
                <input type="text" placeholder="" required>
                <label for="input">UserName</label>
                <i class='bx bxs-user'></i>
            </div>
            <div class="textbox">
                <input type="email" placeholder="" required>
                <label for="input">YourEmail</label>
                <i class='bx bxs-user'></i>
            </div>
            <div class="textbox">
                <input type="tel" placeholder="" required>
                <label for="input">YourNumber</label>
                <i class='bx bxs-user'></i>
            </div>
            <div class="textbox">
                <input type="date" placeholder="" required>
                <label class="Birthday" for="input">Birthday</label>
                <i class='bx bxs-user'></i>
            </div>
            <div class="textbox">
                <input type="text" placeholder="" required>
                <label for="">ClubName</label>
                <i class='bx bxs-user'></i>
            </div>

            <button class="button" type="submit"> registre</button>
        </form>
    </div>

</body>

</html>
